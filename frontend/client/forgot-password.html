<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamSure - 忘记密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        
        .container:hover {
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }
        
        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background-color: #fafafa;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        /* 响应式设计 */
        @media (max-width: 500px) {
            .container {
                margin: 0 20px;
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>忘记密码</h1>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" required placeholder="请输入注册时的邮箱">
            </div>
            <div class="form-group">
                <label for="verificationCode">验证码</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="verificationCode" name="verificationCode" required placeholder="请输入验证码">
                    <button type="button" class="btn" onclick="sendVerificationCode()" style="padding: 10px 15px; font-size: 14px;">发送验证码</button>
                </div>
                <div id="verificationUrlDisplay" style="margin-top: 10px; color: #667eea; font-weight: bold;"></div>
            </div>
            <div class="form-group">
                <label>请完成人机验证</label>
                <!-- Cloudflare Turnstile 验证 -->
                <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" style="margin-top: 10px;"></div>
            </div>
            <button type="submit" class="btn">验证并重置密码</button>
        </form>
        <div class="back-link">
            <a href="login.html">返回登录</a>
        </div>
        <div class="back-link" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
            <a href="guest.html" style="color: #667eea; text-decoration: none; font-size: 14px; font-weight: 600;">游客模式（无需登录）</a>
        </div>
        <div class="back-link" style="margin-top: 10px;">
            <a href="../admin/login.html" style="color: #f59e0b; text-decoration: none; font-size: 14px; font-weight: 600;">管理端入口</a>
        </div>
    </div>

    <!-- Cloudflare Turnstile 脚本 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script>
        let countdown = 0;
        
        // 发送验证码
        function sendVerificationCode() {
            const email = document.getElementById('email').value;
            
            if (!email) {
                alert('请先输入邮箱地址');
                return;
            }
            
            // 开始倒计时
            startCountdown();
            
            fetch('http://192.168.1.12:5000/client/send-verification-code', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('验证码已发送，请注意查收');
                    console.log('验证码：', data.verification_code); // 开发环境下显示验证码
                    console.log('验证码URL：', data.verification_url); // 开发环境下显示验证码URL
                    // 在页面上显示验证码URL
                    const urlDiv = document.getElementById('verificationUrlDisplay');
                    urlDiv.innerHTML = `验证码网址：<a href="${data.verification_url}" target="_blank">${data.verification_url}</a>`;
                } else {
                    alert('发送失败：' + data.message);
                    stopCountdown();
                }
            })
            .catch(error => {
                console.error('发送失败：', error);
                alert('发送失败，请稍后重试');
                stopCountdown();
            });
        }
        
        // 开始倒计时
        function startCountdown() {
            const btn = document.querySelector('button[onclick="sendVerificationCode()"]');
            countdown = 60;
            btn.disabled = true;
            btn.style.opacity = '0.7';
            btn.textContent = `${countdown}秒后重发`;
            
            const timer = setInterval(() => {
                countdown--;
                btn.textContent = `${countdown}秒后重发`;
                
                if (countdown <= 0) {
                    stopCountdown();
                    clearInterval(timer);
                }
            }, 1000);
        }
        
        // 停止倒计时
        function stopCountdown() {
            const btn = document.querySelector('button[onclick="sendVerificationCode()"]');
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.textContent = '发送验证码';
        }
        
        // 验证验证码并重置密码
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const verificationCode = document.getElementById('verificationCode').value;
            
            // 检查Cloudflare验证token
            const token = document.querySelector('[name="cf-turnstile-response"]');
            if (!token || !token.value) {
                alert('请先完成人机验证');
                return;
            }
            
            fetch('http://192.168.1.12:5000/client/verify-code', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, code: verificationCode, cf_token: token.value })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 验证码验证成功，跳转到重置密码页面
                    window.location.href = `reset-password.html?token=${data.token}`;
                } else {
                    alert('验证失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('验证失败：', error);
                alert('验证失败，请稍后重试');
            });
        });
    </script>
</body>
</html>
